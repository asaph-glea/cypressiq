      <stop offset="100%" stop-color="rgba(17,24,39,0)"/>
    </radialGradient>
    <pattern id="gridAmos" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgAmos)"/>

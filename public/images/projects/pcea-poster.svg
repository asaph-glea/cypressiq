      <circle cx="132" cy="65" r="22" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
      <polygon points="128,55 142,65 128,75" fill="#ef4444"/>
      <text x="132" y="105" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Live Ministry Stream</text>

    <text x="105" y="25" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">https://pceaneemanakuru.com</text>

    <!-- Church Portal Content -->
    <!-- Hero Banner inside Mockup -->
    <rect x="25" y="65" width="550" height="130" rx="10" fill="url(#blueGlow)" opacity="0.15"/>
    <rect x="25" y="65" width="550" height="130" rx="10" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    
    <text x="45" y="105" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="20" font-weight="bold">PCEA NEEMA CHURCH NAKURU</text>
    <text x="45" y="130" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="600">Digital Ministry &amp; Global Congregational Hub</text>
    <text x="45" y="155" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Live HD Broadcasts • Daraja M-Pesa Giving • Fellowship Portals</text>

    <!-- Live Stream Widget -->
    <g transform="translate(25, 215)">

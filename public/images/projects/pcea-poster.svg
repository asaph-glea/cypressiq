<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgPcea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="haloPcea" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.25)"/>
      <stop offset="100%" stop-color="rgba(10,16,31,0)"/>
    </radialGradient>
    <pattern id="gridPcea" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgPcea)"/>
  <rect width="800" height="450" fill="url(#haloPcea)"/>
  <rect width="800" height="450" fill="url(#gridPcea)"/>

  <!-- Mockup Window -->
  <g transform="translate(100, 45)">

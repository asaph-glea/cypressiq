    <rect width="600" height="360" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect width="600" height="42" rx="16" fill="#1e293b"/>
    <path d="M 0 42 L 600 42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Window Controls -->

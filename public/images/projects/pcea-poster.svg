    <g transform="translate(310, 215)">
      <rect width="265" height="160" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#10b981" opacity="0.2"/>
      <text x="38" y="44" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" text-anchor="middle">⚡</text>
      <text x="68" y="36" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="bold">M-Pesa Tithes &amp; Giving</text>
